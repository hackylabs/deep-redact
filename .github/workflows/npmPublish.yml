name: Publish package to npmjs
on:
  release:
    types: [created]
jobs:
  verify-install-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - '22.18.0'
          - '24.14.1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@v2
      - run: corepack enable
      - run: corepack prepare pnpm@10.33.0 --activate
      - run: corepack prepare yarn@stable --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify:install-matrix

  publish:
    needs: verify-install-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run verify:migration:fast-redact
      - run: pnpm run verify:migration:v3
      - run: pnpm run verify:examples
      - run: pnpm run verify:speed-benchmarks
        env:
          DEEP_REDACT_BENCH_RUN_SCOPE: release-candidate
      - run: pnpm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
